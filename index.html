<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-sm" style="max-width: 600px; width: 100%;">

            <div class="card-header text-center bg-white py-4">
                <h2 class="mb-0">Reports</h2>
            </div>

            <div class="card-body p-4">

                <div class="row g-3">

                    <!-- SEO Report -->
                    <div class="col-md-6">
                        <div class="card h-100 border">
                            <div class="card-body text-center p-4">
                                <h5 class="card-title">SEO Reports</h5>
                                <p class="card-text text-muted">
                                    View SEO performance and optimization reports.
                                </p>

                                <a href="/seo-reports"
                                   class="btn btn-primary">
                                    View SEO Reports
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Accessibility Report -->
                    <div class="col-md-6">
                        <div class="card h-100 border">
                            <div class="card-body text-center p-4">
                                <h5 class="card-title">Accessibility Reports</h5>
                                <p class="card-text text-muted">
                                    View website accessibility and compliance reports.
                                </p>

                                <a href="/accessibility-report"
                                   class="btn btn-primary">
                                    View Accessibility Report
                                </a>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

</body>
</html>
